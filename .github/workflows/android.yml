name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.2.0
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android CLI
      shell: pwsh
      run: |
        $cliDir = Join-Path $env:RUNNER_TEMP 'android-cli'
        New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
        Invoke-WebRequest 'https://dl.google.com/android/cli/latest/windows_x86_64/android.exe' -OutFile (Join-Path $cliDir 'android.exe')
        $cliDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $cliDir 'android.exe') --no-metrics --version
        if ($LASTEXITCODE) { throw 'Android CLI setup failed.' }
    - name: Install pinned Android tools
      shell: pwsh
      run: android --no-metrics "--sdk=$env:ANDROID_HOME" sdk install "platforms/android-35" "build-tools/36.0.0" "ndk/27.3.13750724" "cmake/3.22.1"
    - name: Prepare pinned codec sources
      shell: pwsh
      run: ./scripts/Prepare-Pyrowave.ps1
    - name: JVM tests and unsigned ARM64 release
      working-directory: android
      shell: pwsh
      run: |
        ./gradlew.bat testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest "-PclientAbi=arm64-v8a" --no-daemon
        if ($LASTEXITCODE) { throw 'Android validation failed.' }
    - name: Preserve test reports
      if: (always()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: android-test-reports
        BUILD_PATHS: android/app/build/reports/tests/
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
    - name: Upload installable development APK
      uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: phoenix-companion-arm64-development-apk
        BUILD_PATHS: android/app/build/outputs/apk/debug/*.apk
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    - name: Upload unsigned release APK
      uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: phoenix-companion-arm64-release-unsigned
        BUILD_PATHS: android/app/build/outputs/apk/release/*-unsigned.apk
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write
