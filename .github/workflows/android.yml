name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned Android tools
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Prepare pinned codec sources
        shell: pwsh
        run: ./scripts/Prepare-Pyrowave.ps1
      - name: JVM tests and unsigned ARM64 release
        working-directory: android
        shell: pwsh
        run: |
          ./gradlew.bat testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest "-PclientAbi=arm64-v8a" --no-daemon
          if ($LASTEXITCODE) { throw 'Android validation failed.' }
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: warn
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-companion-arm64-development-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-companion-arm64-release-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
